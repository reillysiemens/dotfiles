################################################################################
# Theme
################################################################################

# Gruvbox palette. Single source of truth for everything below and for the
# scripts in ../scripts/.
bg0_h="#1d2021"
bg0="#282828"
bg1="#3c3836"
bg2="#504945"
fg="#ebdbb2"
red="#fb4934"
green="#b8bb26"
yellow="#fabd2f"
blue="#83a598"
purple="#d3869b"
aqua="#8ec07c"
orange="#fe8019"

# Accent: subtle dark gray that frames the UI without competing with the
# per-window rainbow or the per-session color. Hardcoded by design --
# the personality lives on @wc and @session_color, not here.
accent="#3c3836"

# Mirror the palette as tmux user options so shell scripts (session-color,
# status-right, fzf-*) read it from one place via `tmux show-option`. Style
# options below still use the $name form because user options are not
# format-expanded inside style strings.
set -gq @bg0_h  "$bg0_h"
set -gq @bg0    "$bg0"
set -gq @bg1    "$bg1"
set -gq @bg2    "$bg2"
set -gq @fg     "$fg"
set -gq @red    "$red"
set -gq @green  "$green"
set -gq @yellow "$yellow"
set -gq @blue   "$blue"
set -gq @purple "$purple"
set -gq @aqua   "$aqua"
set -gq @orange "$orange"
set -gq @accent "$accent"

# Fallback for the window between session creation and the session-created
# hook firing -- and for any format lookup that beats the hook to the punch.
# Each session overrides this in its own scope via ../scripts/session-color.
set -gq @session_color "$fg"

# Status Colors

set -g status-style "fg=$fg,bg=$bg0,dim"

# Window Colors

setw -g window-status-style "fg=$fg,bg=$bg0,dim"

setw -g window-status-current-style "fg=$bg0,bg=$fg"

# change color if a window's bell has rung
setw -g window-status-bell-style "fg=$bg0,bg=$accent"

# Pane Colors

set -g pane-border-style "fg=$fg"
set -g pane-active-border-style "fg=$accent,bg=default"

# Prompt Colors

# Used by tmux's command-prompt (rename-session input, the fzf-sessions
# Ctrl-T / Ctrl-R prompts) and confirm-before. Default is black on bright
# yellow, which jars against Gruvbox.
#
# With `status-keys vi`, tmux swaps between these two styles to indicate
# the prompt's editing mode: message-style for insert (typing), and
# message-command-style after Esc for normal/command mode. We keep insert
# subdued to match the rest of the status bar and use a warm accent for
# normal mode so the swap is unmissable in peripheral vision — same idea
# as vim's airline/lightline coloring its mode segment.
set -g message-style "fg=$fg,bg=$bg1"
set -g message-command-style "fg=$bg0_h,bg=$aqua,bold"

# Copy Mode Colors

# `mode-style` paints two things: the selection highlight in copy-mode
# (prefix [) and the [line/total] position indicator that floats in the
# top-right while copy-mode is active. Default is black on bright yellow,
# which detonates against Gruvbox. Aqua mirrors message-command-style so
# "tmux is in an interactive mode" reads as one visual idiom across both
# the prompt and copy-mode.
set -g mode-style "fg=$bg0,bg=$aqua"

# Search hit highlighting in copy-mode (`/` and `?`). Defaults are cyan
# for matches and magenta for the current hit — both alien to the rest
# of the palette. Orange "you're here" stands out against the aqua
# selection without competing with it; non-current matches re-use the
# selection's aqua so they read as "more of the same thing".
set -g copy-mode-match-style "fg=$bg0,bg=$aqua"
set -g copy-mode-current-match-style "fg=$bg0,bg=$orange,bold"

# Misc Status

# turn the status bar on
set -g status on

# Per-window accent palette: #I mod 7 selects one of 7 gruvbox bright colors
# in ROYGBIV order, so window 1 starts on red and walks the rainbow. Window 7
# wraps to slot 0 (violet), window 8 back to red, and so on. Stored in @wc so
# the format strings below stay readable; #{E:@wc} expands it per-window at
# render time. A conditional chain is required because tmux format strings
# can't dereference a computed option name.
#
#  #I mod 7 | window | rainbow | gruvbox
#  ---------+--------+---------+--------
#    1      |   1    | red     | #fb4934
#    2      |   2    | orange  | #fe8019
#    3      |   3    | yellow  | #fabd2f
#    4      |   4    | green   | #b8bb26
#    5      |   5    | blue    | #83a598
#    6      |   6    | indigo  | #8ec07c (aqua)
#    0      |   7    | violet  | #d3869b (purple)
#
set -g @wc "#{?#{==:#{e|%:#I,7},1},$red,#{?#{==:#{e|%:#I,7},2},$orange,#{?#{==:#{e|%:#I,7},3},$yellow,#{?#{==:#{e|%:#I,7},4},$green,#{?#{==:#{e|%:#I,7},5},$blue,#{?#{==:#{e|%:#I,7},6},$aqua,$purple}}}}}}"

# Flash bell-rung windows by flipping the style every second. #{T:@now}
# runs strftime on @now's value ("%s") to get the current epoch second —
# pure tmux, no shell fork. @flash is true when the window has a pending
# bell and the second is odd, and the format below swaps fg/bg on that.
set -g @now '%s'
set -g @flash '#{&&:#{window_bell_flag},#{e|%:#{T:@now},2}}'

# window status format
setw -g window-status-format "#[fg=#{?#{E:@flash},$bg0_h,#{E:@wc}},bg=#{?#{E:@flash},#{E:@wc},$bg0_h}] #I #[bg=#{?#{E:@flash},$fg,$bg0},fg=#{?#{E:@flash},$bg0,$fg}] #W "
setw -g window-status-current-format "#[fg=$bg0_h,bold]#[bg=#{E:@wc}] #[underscore]#I#[nounderscore] #[bg=$fg]#[fg=$bg0,bold] #[underscore]#W#[nounderscore] "

# update the status bar more frequently
set -g status-interval 1

# Left Status

set -g status-left-length 60
set -g status-left "#[fg=#{@accent},bold][ #[fg=#{@session_color},nobold]#S#[fg=#{@accent},bold] ] "

# Right Status

# All three metrics are rendered by a single script so we fork once per
# tick instead of three times, and so each percentage can be colored on
# its own green -> yellow -> orange -> red threshold cycle. The script
# reads @accent from tmux to recolor its separators.
set -g status-right-length 80
set -g status-right "#(~/.config/tmux/scripts/status-right)"

# Session Color

# Hash each session's name into a Gruvbox palette color and stash it as a
# session-scoped @session_color so status-left can tint #S accordingly.
# Seeds all existing sessions at config load (matters for `prefix r`);
# hooks keep it fresh as sessions are created or renamed.
run-shell 'for s in $(tmux list-sessions -F "#S" 2>/dev/null); do ~/.config/tmux/scripts/session-color "$s"; done'
set-hook -g session-created 'run-shell "~/.config/tmux/scripts/session-color #{q:session_name}"'
set-hook -g session-renamed 'run-shell "~/.config/tmux/scripts/session-color #{q:session_name}"'
