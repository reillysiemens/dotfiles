################################################################################
# Theme
################################################################################

# Status Colors

set -g status-style "fg=#ebdbb2,bg=#282828,dim"

# Window Colors

setw -g window-status-style "fg=#ebdbb2,bg=#282828,dim"

setw -g window-status-current-style "fg=#282828,bg=#ebdbb2"

# change color if a window has activity in it
setw -g window-status-activity-style "fg=#282828,bg=#fe8019"

# Pane Colors

set -g pane-border-style "fg=#ebdbb2"
set -g pane-active-border-style "fg=#fe8019,bg=default"

# Misc Status

# turn the status bar on
set -g status on

# Per-window accent palette: #I mod 7 selects one of 7 gruvbox bright colors
# in ROYGBIV order, so window 1 starts on red and walks the rainbow. Window 7
# wraps to slot 0 (violet), window 8 back to red, and so on. Stored in @wc so
# the format strings below stay readable; #{E:@wc} expands it per-window at
# render time. A conditional chain is required because tmux format strings
# can't dereference a computed option name.
#
#  #I mod 7 | window | rainbow | gruvbox
#  ---------+--------+---------+--------
#    1      |   1    | red     | #fb4934
#    2      |   2    | orange  | #fe8019
#    3      |   3    | yellow  | #fabd2f
#    4      |   4    | green   | #b8bb26
#    5      |   5    | blue    | #83a598
#    6      |   6    | indigo  | #8ec07c (aqua)
#    0      |   7    | violet  | #d3869b (purple)
#
set -g @wc '#{?#{==:#{e|%:#I,7},1},#fb4934,#{?#{==:#{e|%:#I,7},2},#fe8019,#{?#{==:#{e|%:#I,7},3},#fabd2f,#{?#{==:#{e|%:#I,7},4},#b8bb26,#{?#{==:#{e|%:#I,7},5},#83a598,#{?#{==:#{e|%:#I,7},6},#8ec07c,#d3869b}}}}}}'

# Flash activity windows by flipping the style every second. #{T:@now}
# runs strftime on @now's value ("%s") to get the current epoch second —
# pure tmux, no shell fork. @flash is true when the window has activity
# and the second is odd, and the format below swaps fg/bg on that.
set -g @now '%s'
set -g @flash '#{&&:#{window_activity_flag},#{e|%:#{T:@now},2}}'

# window status format
setw -g window-status-format "#[fg=#{?#{E:@flash},#1d2021,#{E:@wc}},bg=#{?#{E:@flash},#{E:@wc},#1d2021}] #I #[bg=#{?#{E:@flash},#ebdbb2,#282828},fg=#{?#{E:@flash},#282828,#ebdbb2}] #W "
setw -g window-status-current-format "#[fg=#1d2021,bold]#[bg=#{E:@wc}] #[underscore]#I#[nounderscore] #[bg=#ebdbb2]#[fg=#282828,bold] #[underscore]#W#[nounderscore] "

# update the status bar more frequently
set -g status-interval 1

# Left Status

set -g status-left-length 60
set -g status-left "#[fg=#{@accent},bold][#[fg=#ebdbb2]#S#[fg=#{@accent},bold]] "

# Right Status

set -g status-right-length 80
set -g status-right '#[fg=#{@accent},bold][#[fg=#ebdbb2] #(cut -d " " -f 1-3 /proc/loadavg) #[fg=#{@accent},bold]|#[fg=#ebdbb2] #(~/.config/tmux/scripts/battery-percentage) #[fg=#{@accent},bold]]#[fg=#ebdbb2]'

# Accent Color

# Hash the hostname into a Gruvbox accent. Sets @accent plus overrides the
# style options above (which don't format-expand user variables). Must be
# last so its overrides win. Re-runs on prefix r.
run-shell '~/.config/tmux/scripts/accent-color'