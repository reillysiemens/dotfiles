################################################################################
# Behavior
################################################################################

# keep a large history
set -g history-limit 200000

# monitor bells in windows (explicit attention signals from programs)
setw -g monitor-bell on
setw -g monitor-activity off

# use vim motion keys while in copy mode
setw -g mode-keys vi

# set base window and pane indices to 1
set -g base-index 1
setw -g pane-base-index 1

# my terminal has all these colors!
set -g default-terminal "tmux-256color"

# advertise truecolor (RGB) to inner programs regardless of TERM. The
# tmux 3.2+ terminal-features idiom supersedes the older
# `terminal-overrides ',xterm-256color:Tc'` form, which only matched a
# single TERM string.
set -as terminal-features ",*:RGB"

# renumber windows when one is closed
set -g renumber-windows on

# preserve setting of window names
set -g allow-rename off

# shorten command delay
set -sg escape-time 0

# how long status-line messages stick around. Default 750ms is too brief to
# read the `prefix r` reload confirmation or any `display-message` from a
# hook; 2s is comfortable without lingering.
set -g display-time 2000

# OSC-52 clipboard escapes. Local copies go through ~/.local/bin/cb
# (xclip / wl-copy / clip.exe) via the copy-mode-vi y binding, which is
# fast and has no payload size cap. OSC 52 is purely the fallback for
# environments where cb can't reach a backend (typical case: SSH'd into
# a remote with no xclip, no wl-copy, no clip.exe).
#
# Doing both unconditionally races them — the OSC 52 path has a terminal-
# imposed size cap (varies; can be as low as ~75KB) and "last write wins"
# would let a truncated OSC 52 clobber the full cb write. So we probe cb
# at config-load time and only enable OSC 52 emission (`on`) when cb has
# no backend. Otherwise we stay on `external`, the modern tmux default,
# which still lets inner programs (vim, etc.) emit OSC 52 on their own.
if-shell '~/.local/bin/cb --check >/dev/null 2>&1' \
    'set -g set-clipboard external' \
    'set -g set-clipboard on'

# forward terminal focus events to the program in the active pane (and enable
# tmux's own pane-focus-in/out hooks). TUIs like lazygit, yazi, k9s, gitui,
# and any bubbletea/ratatui app that opts in will refresh on focus.
set -g focus-events on

# make window resizing better between multiple clients
setw -g aggressive-resize on

# enable OSC-8 hyperlinks
set -as terminal-features ",*:hyperlinks"
