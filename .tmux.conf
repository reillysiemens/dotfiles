# Global Configuration {{{

# reset the default prefix
set -g prefix C-a      # set the prefix to a
bind a send-prefix # pass through to nested tmux sessions

# keep a large history
set -g history-limit 100000

# really nice combination with shell C-l
bind -n C-k clear-history

# monitor acitivity in windows
setw -g monitor-activity on

# use vim motion keys while in copy mode
setw -g mode-keys vi

# set base window and pane indices to 1
set -g base-index 1
setw -g pane-base-index 1

# my terminal has all these colors!
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# renumber windows when one is closed
set -g renumber-windows on

# preserve setting of window names
set -g allow-rename off

# shorten command delay
set -sg escape-time 0

# make window resizing better between multiple clients
setw -g aggressive-resize on

# }}}
# Misc Bindings {{{

# reload tmux configuration with r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf."

# new split (horizontal / vertical)
bind - split-window -v # split pane horizontally
bind '\' split-window -h # split pane vertically

# new split in current pane (horizontal / vertical)
bind _ split-window -v -c '#{pane_current_path}' # split pane horizontally
bind | split-window -h -c '#{pane_current_path}' # split pane vertically

bind Space list-panes # list panes
bind Enter break-pane # break-pane

# }}}
# Session Bindings {{{

# cap S to rename sessions
bind S command-prompt -I "#S" "rename-session '%%'"

# }}}
# Window Bindings {{{

# Rebind c to use the current path in a new window
bind c neww

# Bind C to use the current path in a new window
bind C neww -c '#{pane_current_path}'

# C-a C-a for last active window
bind C-a last-window

# cap A to rename the active window
bind A command-prompt "rename-window %%"

# cap K to kill active window, but ask first
bind K confirm-before -p "kill-window #W? (y/n)" kill-window

# }}}
# Pane Bindings {{{

# use vim-like keybindings to navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# cap P to kill active pane, but ask first
bind P confirm-before -p "kill-pane #P? (y/n)" kill-pane

# }}}
# Resizing Bindings {{{

# use vim-like keybindings to resize panes
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# }}}
# Unbindings {{{

unbind C-b # unbind default prefix key
unbind '"' # unbind default horizontal split
unbind %   # unbind default vertical split
unbind '$' # unbind default rename-session
unbind &   # unbind default kill-window
unbind x   # unbind default kill-pane
unbind M-1 # unbind default select-layout even-horizontal
unbind M-2 # unbind default select-layout even-vertical
unbind M-3 # unbind default select-layout main-horizontal
unbind M-4 # unbind default select-layout main-vertical
unbind M-5 # unbind default select-layout tiled

# }}}
# Layouts {{{

# Reorder panes with a particular layout
bind M-= select-layout "tiled"
bind M-- select-layout "even-vertical"
bind M-'\' select-layout "even-horizontal"
bind M-r rotate-window

# }}}
# Status Colors {{{

set -g status-style "fg=#ebdbb2,bg=#282828,dim"

# }}}
# Window Colors {{{

setw -g window-status-style "fg=#ebdbb2,bg=#282828,dim"

setw -g window-status-current-style "fg=#282828,bg=#ebdbb2"

# change color if a window has activity in it
setw -g window-status-activity-style "fg=#282828,bg=#fe8019"

# }}}
# Pane Colors {{{

set -g pane-border-style "fg=#ebdbb2"
set -g pane-active-border-style "fg=#fe8019,bg=default"

# }}}
# Misc Status {{{

# turn the status bar on
set -g status on

# Per-window accent palette: #I mod 7 selects one of 7 gruvbox bright colors
# in ROYGBIV order, so window 1 starts on red and walks the rainbow. Window 7
# wraps to slot 0 (violet), window 8 back to red, and so on. Stored in @wc so
# the format strings below stay readable; #{E:@wc} expands it per-window at
# render time. A conditional chain is required because tmux format strings
# can't dereference a computed option name.
#
#  #I mod 7 | window | rainbow | gruvbox
#  ---------+--------+---------+--------
#    1      |   1    | red     | #fb4934
#    2      |   2    | orange  | #fe8019
#    3      |   3    | yellow  | #fabd2f
#    4      |   4    | green   | #b8bb26
#    5      |   5    | blue    | #83a598
#    6      |   6    | indigo  | #8ec07c (aqua)
#    0      |   7    | violet  | #d3869b (purple)
#
set -g @wc '#{?#{==:#{e|%:#I,7},1},#fb4934,#{?#{==:#{e|%:#I,7},2},#fe8019,#{?#{==:#{e|%:#I,7},3},#fabd2f,#{?#{==:#{e|%:#I,7},4},#b8bb26,#{?#{==:#{e|%:#I,7},5},#83a598,#{?#{==:#{e|%:#I,7},6},#8ec07c,#d3869b}}}}}}'

# window status format
setw -g window-status-format "#[fg=#{E:@wc}]#[bg=#1d2021] #I #[bg=#282828]#[fg=#ebdbb2] #W "
setw -g window-status-current-format "#[fg=#1d2021,bold]#[bg=#{E:@wc}] #I #[bg=#ebdbb2]#[fg=#282828,bold] #W "

# update the status bar more frequently
set -g status-interval 1

# }}}
# Left Status {{{

set -g status-left-length 60
set -g status-left "λ #[fg=#{@accent}][#[fg=#ebdbb2]#S#[fg=#{@accent}]] "

# }}}
# Right Status {{{

set -g status-right-length 80
set -g status-right '#[fg=#{@accent}][#[fg=#ebdbb2] #(cut -d " " -f 1-3 /proc/loadavg) #[fg=#{@accent}]|#[fg=#ebdbb2] #(~/.config/tmux/scripts/battery-percentage) #[fg=#{@accent}]]#[fg=#ebdbb2]'

# }}}
# Accent Color {{{

# Hash the hostname into a Gruvbox accent. Sets @accent plus overrides the
# style options above (which don't format-expand user variables). Must be
# last so its overrides win. Re-runs on prefix r.
run-shell '~/.config/tmux/scripts/accent-color'

# }}}

